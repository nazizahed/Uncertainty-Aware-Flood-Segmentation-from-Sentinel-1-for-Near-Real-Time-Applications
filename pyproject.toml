[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sar-flood-uq"
version = "0.1.0.dev0"
description = "Development scaffold for uncertainty-aware Sentinel-1 flood segmentation"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Sadra Zahed Kachaee"}]
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
  "scipy>=1.10,<2",
  "segmentation-models-pytorch>=0.3.3,<1",
  "timm>=0.9,<2",
  "torch>=2.1,<3",
  "torchvision>=0.16,<1",
  "tqdm>=4.65,<5",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.7,<4",
  "opencv-python-headless>=4.8,<5",
  "pandas>=2,<3",
  "scikit-learn>=1.3,<2",
  "seaborn>=0.12,<1",
]
data = ["huggingface-hub>=0.24,<2"]
deployment = [
  "fvcore>=0.1.5",
  "onnx>=1.14,<2",
  "onnxruntime>=1.16,<2",
]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
